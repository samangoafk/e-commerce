<mat-toolbar color="primary">
    <span> {{ nomeLoja | uppercase }} </span>
    <span class="flex-spacer"></span>
    <button mat-button routerLink="/home"> Início </button>
    <button mat-button routerLink="/produtos" > Produtos</button>
    <button mat-button routerLink="/carrinho" > Carrinho {{ quantidade() }}</button>
    <button mat-button routerLink="/checkout" > Checkout</button>
    @if(usuarioLogado()){
        <span>{{usuarioAtual()?.email}}</span>
        <button mat-button type="button" (click)="sair()"></button>
    }@else {
        <button mat-button type="button" routerLink="/login"></button>
    }
</mat-toolbar>
