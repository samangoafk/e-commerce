<!--Cria uma div para exibir as informações do produto -->
<div class="produto">

    <h3>{{ nome | uppercase }}</h3>
    <p>{{ preco | precoFormatado }}</p>

    <button (click)="selecionarProduto()">
        Selecionar {{ nome }}
    </button> 
    
    <div style=" margin: 22px 0;"></div>
    <button mat-raised-button collor="primary" (click)="adicionarAoCarrinho()">
        Adicionar ao Carrinho
    </button>
    

</div>
