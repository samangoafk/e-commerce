<!--Cria uma div para exibir as informações do produto -->
<mat-card class="produto">

<mat-card-header>
    <mat-card-title>{{ nome | uppercase }}</mat-card-title>
</mat-card-header>

<mat-card-content>
    <p>{{ preco | precoFormatado }}</p>
</mat-card-content>

<mat-card-actions>
    <button mat-stroked-button color="accent" (click)="selecionarProduto()">
        Selecionar {{ nome }}
    </button> 

    <button mat-raised-button color="primary" (click)="adicionarAoCarrinho()">
        Adicionar ao Carrinho
    </button>

</mat-card-actions>
    
    

</mat-card>
